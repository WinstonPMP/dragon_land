<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Bastion: Last Stand - Download Now</title>
    <meta name="description" content="Epic Tower Defense Empire War. Defend the Emperor against dark wizards in 20 epic levels. Free on App Store and Google Play.">
    
    <!-- Open Graph tags for social sharing -->
    <meta property="og:title" content="Dragon Bastion: Last Stand">
    <meta property="og:description" content="Epic Tower Defense - Defend the Emperor in 20 Epic Levels!">
    <meta property="og:type" content="website">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #1a0033 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .subtitle {
            font-size: 18px;
            color: #c9a8ff;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            padding: 16px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            min-width: 280px;
        }
        
        .ios-btn {
            background: linear-gradient(45deg, #007aff, #0051d5);
        }
        
        .android-btn {
            background: linear-gradient(45deg, #34a853, #1e7e34);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .feature {
            font-size: 14px;
            color: #c9a8ff;
        }
        
        .loading {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
            min-height: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #999;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .logo { font-size: 36px; }
            .subtitle { font-size: 14px; }
            .download-btn { padding: 14px 30px; font-size: 15px; min-width: 250px; }
            .features { gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">DRAGON BASTION</h1>
        <p class="subtitle">⚔️ LAST STAND ⚔️</p>
        <p class="tagline">Epic Tower Defense Empire War<br>Defend the Emperor in 20 Epic Levels!</p>
        
        <div class="download-buttons" id="buttons">
            <a href="https://apps.apple.com/app/id6762636249" class="download-btn ios-btn" id="iosBtn">
                📱 Download on App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.dragonsiege.game" class="download-btn android-btn" id="androidBtn">
                🤖 Get it on Google Play
            </a>
        </div>
        
        <div class="features">
            <div class="feature">✓ 100% Free</div>
            <div class="feature">✓ Plays Offline</div>
            <div class="feature">✓ No Pay-to-Win</div>
        </div>
        
        <p class="loading" id="loadingText"></p>
    </div>

    <script>
        // Detect device and redirect
        (function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const iosUrl = 'https://apps.apple.com/app/id6762636249';
            const androidUrl = 'https://play.google.com/store/apps/details?id=com.dragonsiege.game';
            const loadingText = document.getElementById('loadingText');
            const iosBtn = document.getElementById('iosBtn');
            const androidBtn = document.getElementById('androidBtn');
            
            // Detect iOS (iPhone, iPad, iPod)
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            
            // Detect Android
            const isAndroid = /android/i.test(userAgent);
            
            // Detect Mac (also send to App Store)
            const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(userAgent);
            
            if (isIOS) {
                // iOS user - hide Android button, redirect to App Store
                androidBtn.style.display = 'none';
                loadingText.innerHTML = '<span class="spinner"></span>Redirecting to App Store...';
                setTimeout(function() {
                    window.location.href = iosUrl;
                }, 2000);
            } else if (isAndroid) {
                // Android user - hide iOS button, redirect to Play Store
                iosBtn.style.display = 'none';
                loadingText.innerHTML = '<span class="spinner"></span>Redirecting to Google Play...';
                setTimeout(function() {
                    window.location.href = androidUrl;
                }, 2000);
            } else if (isMac) {
                // Mac user - show App Store option
                loadingText.innerHTML = '<span class="spinner"></span>Redirecting to App Store...';
                setTimeout(function() {
                    window.location.href = iosUrl;
                }, 2000);
            } else {
                // Desktop/Other - show both buttons, no auto-redirect
                loadingText.innerHTML = 'Choose your platform above ⬆️';
            }
        })();
    </script>
</body>
</html>
