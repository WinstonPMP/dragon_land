<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Bastion: Last Stand - Download Now</title>
    <meta http-equiv="refresh" content="2; url=https://apps.apple.com/app/id6762636249">
    <meta name="description" content="Epic Tower Defense Empire War. Defend the Emperor against dark wizards in 20 epic levels. Free on App Store.">
    
    <!-- Open Graph tags for social sharing -->
    <meta property="og:title" content="Dragon Bastion: Last Stand">
    <meta property="og:description" content="Epic Tower Defense - Defend the Emperor in 20 Epic Levels!">
    <meta property="og:type" content="website">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #4a0080 50%, #1a0033 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .subtitle {
            font-size: 18px;
            color: #c9a8ff;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .tagline {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            color: white;
            padding: 18px 50px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 30px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6);
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .feature {
            font-size: 14px;
            color: #c9a8ff;
        }
        
        .loading {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }
        
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #999;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .logo { font-size: 36px; }
            .subtitle { font-size: 14px; }
            .download-btn { padding: 15px 35px; font-size: 16px; }
            .features { gap: 15px; }
        }

</head>
<body>
    <div class="container">

        <a href="https://apps.apple.com/app/id6762636249" class="download-btn">
            📱 Download on App Store
        </a>
        
        <div class="features">
            <div class="feature">✓ 100% Free</div>
            <div class="feature">✓ Plays Offline</div>
            <div class="feature">✓ No Pay-to-Win</div>
        </div>
        
        <p class="loading">
            <span class="spinner"></span>
            Redirecting to App Store...
        </p>
    </div>

    <script>
        // Backup redirect after 2 seconds
        setTimeout(function() {
            window.location.href = 'https://apps.apple.com/app/id6762636249';
        }, 2000);
    </script>
</body>
</html>
